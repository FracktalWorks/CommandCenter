# AI Company Brain — Docker Compose stack.
# Same file works for local dev (Windows / Mac via Docker Desktop) and the
# Hostinger KVM 4 VPS (Ubuntu 24.04 + Docker). Compose profiles let you start
# lean and add Langfuse later:
#
#   Lean (Phase 0 minimum):  docker compose --profile core up -d
#   Full  (with observability): docker compose --profile core --profile obs up -d
#
# AGE (Apache property-graph) is deferred to Phase 2 — Phase 0 only needs
# pgvector + relational tables. See ai-company-brain/system_architecture.md §4.

name: acb

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: acb-postgres
    <<: *restart
    profiles: ["core", "obs"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acb_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-acb}
    ports:
      # Bind to loopback ONLY. Docker's `-p` publishing inserts iptables DOCKER
      # rules that bypass UFW, so a bare "5432:5432" exposed Postgres to the
      # internet despite the firewall. The host app connects over 127.0.0.1 and
      # in-compose services (e.g. Langfuse) use the compose network, so loopback
      # is sufficient. Override POSTGRES_BIND to expose it deliberately.
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - acb-postgres-data:/var/lib/postgresql/data
      - ./postgres/00_create_databases.sql:/docker-entrypoint-initdb.d/00_create_databases.sql:ro
      - ./postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-acb} -d $${POSTGRES_DB:-acb}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Vanilla Redis 7 is sufficient for Phase 0:
    #   - Redis Streams (event bus / webhook deduplication)
    #   - agent-framework-redis RedisHistoryProvider (conversation history per thread)
    #   - agent-framework-redis RedisContextProvider (persistent agent context)
    # Redis Stack (RediSearch + RedisJSON) is only needed if/when we enable
    # LiteLLM's redis-semantic cache backend — deferred to Phase 2 (WBS 1.8).
    image: redis:7-alpine
    container_name: acb-redis
    <<: *restart
    profiles: ["core", "obs"]
    ports:
      # Loopback only — see the Postgres note above. Redis has no auth, so a
      # public "6379:6379" was an open data store bypassing UFW via Docker.
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - acb-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Neo4j — bi-temporal knowledge graph (Graphiti). ──────────────────────
  # Opt-in via `--profile memory`.  Required when GRAPHITI_ENABLED=true.
  # Graphiti stores time-stamped entity facts extracted from agent
  # conversations and ingestion events, enabling queries like:
  #   "When did Deal X change stage?" / "What is Contact Y's history?"
  neo4j:
    image: neo4j:5-community
    container_name: acb-neo4j
    <<: *restart
    profiles: ["memory"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_dev_change_me}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - acb-neo4j-data:/data
      - acb-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-neo4j_dev_change_me} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 15

  # --- LLM routing — handled by litellm Python SDK directly (no proxy container). ---
  # Provider API keys are stored encrypted in Postgres (provider_keys table).
  # See packages/acb_llm/acb_llm/client.py and key_store.py.

  # --- Langfuse (self-hosted observability). Opt-in via `--profile obs`. ---
  langfuse:
    image: langfuse/langfuse:2
    container_name: acb-langfuse
    <<: *restart
    profiles: ["obs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-acb}:${POSTGRES_PASSWORD:-acb_dev_change_me}@postgres:5432/${POSTGRES_DB:-acb}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-langfuse-secret-change-me}
      SALT:            ${LANGFUSE_SALT:-dev-langfuse-salt}
      NEXTAUTH_URL:    ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  # --- Copilot SDK mutation sandbox image. Build via `--profile sandbox`. ---
  # Not a long-running service — the image is built here so
  # `docker compose --profile sandbox build` produces acb-mutation-runner:latest.
  # The orchestrator spawns short-lived `docker run --rm -d` containers from
  # this image on demand; no persistent container is kept running.
  #
  # Auth (pass at least one):
  #   LITELLM_MASTER_KEY  — BYOK auth for gateway /v1 (litellm SDK, no proxy)
  #   GITHUB_TOKEN        — standard Copilot subscription auth
  #
  # Build only: docker compose --profile sandbox build mutation
  mutation:
    build:
      context: ../apps/services/orchestrator
      dockerfile: Dockerfile.mutation
    image: acb-mutation-runner:latest
    profiles: ["sandbox"]
    # Override entrypoint so `docker compose up` is a no-op for this service.
    entrypoint: ["true"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Copilot SDK session sandbox image. Build via `--profile sandbox`. ---
  # BO-7 phase 2: containerizes just the `copilot` CLI binary as a TCP
  # JSON-RPC server (orchestrator/copilot_sandbox.py) for code_task and the
  # App Workshop app-builder — the host-side SDK/orchestration is unchanged,
  # it just connects to this container's socket instead of a local
  # subprocess. Not a long-running service — the orchestrator spawns
  # short-lived, per-call (or per-thread, for app-builder) containers on
  # demand; nothing here is kept running by `docker compose up`.
  #
  # No auth env needed at build or (compose) run time — BYOK credentials
  # travel in the create_session RPC payload the host constructs after
  # connecting, never as container env (see Dockerfile.copilot-sandbox).
  #
  # Build only: docker compose --profile sandbox build copilot-sandbox
  copilot-sandbox:
    build:
      context: ../apps/services/orchestrator
      dockerfile: Dockerfile.copilot-sandbox
    image: acb-copilot-sandbox:latest
    profiles: ["sandbox"]
    # Override entrypoint so `docker compose up` is a no-op for this service.
    entrypoint: ["true"]

  # --- Self-hosted meeting bot (Note Taker §3.13). Profile: "meetingbot". ---
  # A headless-Chrome participant that joins a Google Meet link, records the
  # call, and (optionally) streams a live transcript back to the gateway. Kept
  # OUT of the "core" profile on purpose: each in-call bot is a real Chrome
  # instance (~1-3 GB RAM + up to 2 CPU), so it only runs where there's
  # headroom, and only when explicitly enabled.
  #
  # The gateway reaches it over the host port below (MEETING_BOT_URL); the
  # worker calls back to the gateway for live segments, which is why it needs
  # host-gateway resolution.
  #
  #   docker compose --profile meetingbot up -d --build meeting-bot
  meeting-bot:
    build:
      context: ../apps/services/meeting_bot
    image: acb-meeting-bot:latest
    container_name: acb-meeting-bot
    profiles: ["meetingbot"]
    <<: *restart
    environment:
      # Shared secret for gateway <-> worker calls, both directions.
      MEETING_BOT_TOKEN: ${MEETING_BOT_TOKEN:-}
      MEETING_BOT_DATA: /data
      # Live transcript + speaking are additive and gated: unset -> the bot just
      # records and the normal batch pipeline runs.
      #
      # LIVE_ASR_URL is a self-hosted streaming ASR (free per minute, if you run
      # one). With none, the worker asks the gateway for a short-lived token for
      # whichever provider is keyed in Settings -> Models — so live captions
      # follow the key you already set, and the master key stays out of this
      # container.
      LIVE_ASR_URL: ${LIVE_ASR_URL:-}
      LIVE_TOKEN_URL: ${NOTES_LIVE_TOKEN_URL:-}
      EMBED_CMD: ${MEETING_BOT_EMBED_CMD:-}
      TTS_CMD: ${MEETING_BOT_TTS_CMD:-}
      MEET_MAX_DURATION: ${MEET_MAX_DURATION:-14400}
    # Chrome needs more than Docker's default 64 MB of shared memory or it
    # crashes on real pages.
    shm_size: "1gb"
    ports:
      # Host 8095 — the gateway itself owns 8080 on the VPS. Bound to localhost
      # only: nothing outside the box should be able to dispatch a bot.
      - "127.0.0.1:8095:8080"
    volumes:
      - acb-meeting-bot-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  acb-postgres-data:
  acb-redis-data:
  acb-meeting-bot-data:
  acb-neo4j-data:
  acb-neo4j-logs:
