# CommandCenter — PR validation (lint + test only, no deploy).
#
# Runs on every PR to main.  Fast feedback loop — catches regressions
# before they land.  The full deploy workflow runs only on merge to main.

name: pr-check

on:
  pull_request:
    # Deliberately NOT restricted to `branches: [main]`. With that filter a
    # stacked PR (one targeting another feature branch) ran no checks at all,
    # and GitHub renders "no checks" the same as "nothing failing" — so broken
    # code could look green all the way up the stack. Run on every PR instead.
    paths-ignore:
      - "**.md"
      - "ai-company-brain/**"

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      # Blocking: CORRECTNESS-ONLY gate. These rules catch real bugs, not style
      # (F821 undefined-name, F601/F602 repeated dict keys, F502+ format errors,
      # F7 syntax-level issues, B006 mutable default arg). The repo's pre-existing
      # correctness violations were fixed in the accompanying 'fix:' commit, so
      # this passes today and blocks any NEW real bug from merging.
      # NOTE: F811 (redefinition) is deliberately EXCLUDED — it has a pre-existing
      # nested-scope violation in executor.py that needs careful manual handling,
      # tracked in the ratchet plan rather than force-fixed here.
      # Rationale for report-only style: the full ruff check has ~1.3k legacy
      # STYLE findings that are NOT auto-swept — a blanket `ruff --fix` deleted
      # intentional re-exports (see the spec), so style is ratcheted down by hand.
      - name: Ruff correctness (blocking)
        run: uv run ruff check . --select F821,F601,F602,F502,F7,B006

      # Non-blocking report: the FULL ruff check (all configured rules incl. the
      # ~1.3k-finding style backlog + C901 complexity hotspots). This is the
      # ratchet dashboard — the number should trend down; rules graduate to the
      # blocking gate above as each class is cleaned. Ratchet plan + backlog:
      # ai-company-brain/specs/dev_velocity_tooling_2026-07.md
      - name: Ruff full report (style backlog dashboard, non-blocking)
        continue-on-error: true
        run: uv run ruff check . || echo "style backlog above (non-blocking — see ratchet plan)"

      # Blocking: hard ceiling against NEW complexity. Thresholds are
      # grandfathered to current worst-case (abs=F covers cc=223) and the
      # repo-wide average is gated at B (current avg ≈ 6.9). A PR that pushes
      # the average worse, or adds a function worse than today's worst, fails.
      - name: Xenon complexity ceiling (blocking)
        run: uv run xenon --max-absolute F --max-modules F --max-average B apps packages

      # Non-blocking initially: mypy is strict in pyproject but the full repo
      # hasn't been swept. Report now; flip to blocking per the ratchet plan.
      - name: mypy strict (report-only)
        continue-on-error: true
        run: uv run mypy apps packages || echo "type errors above (non-blocking — tracked)"

      # Non-blocking: per-PR codebase-health on just the changed files, so a PR
      # that adds a big/complex function is visible in review before it merges.
      # The weekly whole-repo report is a separate scheduled workflow.
      - name: Codebase health (changed files, report-only)
        continue-on-error: true
        run: uv run python scripts/codebase_health.py --diff --top 10

  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      - name: Run unit tests
        run: uv run python -m pytest tests/unit/ -x -v

  # BO-23. The backup and restore scripts shipped on 2026-08-03 and had never
  # been executed anywhere — they reached Postgres only through
  # `docker exec acb-postgres`, which exists on one machine. The first run of an
  # untested restore should not be during an incident, and "we ran it once in
  # August" decays: a refactor to either script, or a pg_dump format change on a
  # Postgres upgrade, would break it silently and nothing would notice until it
  # mattered. So it runs here, against a real server, on every PR.
  #
  # It is a real round trip — seed, dump, DROP the table, restore, and compare
  # an md5 of the rows. The comparison is the point: every other step passes
  # against an empty database.
  backup-restore:
    name: "Backup/restore rehearsal"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # The runner's client must not be OLDER than the server: pg_dump refuses
      # to dump a newer server, which would fail the job for a reason that has
      # nothing to do with our scripts.
      - name: Install the postgresql-16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Rehearse
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: rehearsal
        run: bash scripts/rehearse_restore.sh

  # The workbench had NO CI at all: a type error or a broken pure helper only
  # surfaced when the VPS rebuilt after merge. Typecheck + vitest are seconds,
  # and they're where the frontend-side invariants live (e.g. genUiText's
  # "an agent's tree can never render [object Object]"). Not a full `next
  # build` — that stays a deploy-time step.
  frontend:
    name: "Frontend (typecheck + unit tests)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench/control_plane
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/control_plane/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

  secret-scan:
    name: "Secret scan"
    runs-on: ubuntu-latest
    # Report-only initially (ratchet, like mypy/ruff-full above): surfaces any
    # credential in a PR's NEW commits without blocking on an install/config
    # hiccup. Graduate to blocking once proven on a few PRs. Scans only the PR's
    # commit range, so it does NOT trip on the historical leak (BO-8) that still
    # needs a coordinated filter-repo purge — see scripts/scan_secrets_history.sh.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # `go install github.com/gitleaks/gitleaks/v8` broke: that tag's go.mod
        # still declares the module path as github.com/zricethezav/gitleaks/v8,
        # so `go install` errors on the path mismatch and the scan never ran.
        # Pull the prebuilt release binary instead — faster and path-stable.
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commits for secrets
        run: |
          RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--no-merges $RANGE" \
            --redact --verbose --exit-code 1
