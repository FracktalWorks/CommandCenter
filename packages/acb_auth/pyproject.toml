[project]
name = "acb-auth"
version = "0.0.1"
description = "RBAC roles, user context, and FastAPI dependency helpers (WBS 1.7)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "acb-common",
    # Org access control resolves roles/overrides from Postgres (acb_auth.access).
    # Imported lazily so the pure permission model stays usable without a DB.
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acb_auth"]

