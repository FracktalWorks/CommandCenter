[project]
name = "platform-api"
version = "0.0.1"
description = "The platform Control Plane — organizations, seats, subscriptions and AI metering (WS-31)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_api"]
